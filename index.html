<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DropLink</title>
    <style>
      :root {
        --bg: #0f172a;
        --surface: #111827;
        --surface-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --primary: #3b82f6;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--text);
        min-height: 100vh;
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 18px;
        margin-bottom: 18px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      }
      h1 { font-size: 1.6rem; margin: 0 0 16px; }
      .device-list {
        display: grid;
        gap: 12px;
      }
      .device {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(31, 41, 55, 0.8);
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); display: inline-block; }
      button, .button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 14px 16px;
        background: var(--primary);
        color: white;
        font-weight: 600;
        font-size: 1rem;
      }
      input[type='file'] {
        display: none;
      }
      .file-meta {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 8px;
      }
      .progress {
        height: 12px;
        background: rgba(148, 163, 184, 0.15);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress > span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #60a5fa, #22c55e);
        width: 0;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <h1>iPhoneTransfer</h1>
        <div class="device-list" id="deviceList"></div>
      </div>

      <div class="card">
        <label class="button" for="fileInput">📤 Enviar para PC</label>
        <input id="fileInput" type="file" multiple />
        <div class="file-meta" id="selectedFiles">Nenhum arquivo selecionado</div>
      </div>

      <div class="card">
        <h3>Arquivos recebidos</h3>
        <div id="receivedFiles" class="file-meta">Nenhum arquivo recebido ainda.</div>
      </div>

      <div class="card">
        <h3>Transferência</h3>
        <div class="file-meta" id="transferStatus">Aguardando arquivo...</div>
        <div class="progress" aria-label="progresso"><span id="transferBar"></span></div>
      </div>
    </div>

    <script>
      const state = {
        selectedFiles: [],
        activeTransfer: null,
      };

      const deviceList = document.getElementById('deviceList');
      const fileInput = document.getElementById('fileInput');
      const selectedFiles = document.getElementById('selectedFiles');
      const transferStatus = document.getElementById('transferStatus');
      const transferBar = document.getElementById('transferBar');
      const receivedFiles = document.getElementById('receivedFiles');

      const baseUrl = window.location.origin;

      async function loadDevices() {
        try {
          const response = await fetch(`${baseUrl}/api/devices`);
          const payload = await response.json();
          const devices = payload.devices || [];
          deviceList.innerHTML = devices.map((device) => `
            <div class="device">
              <div>
                <strong>${device.name}</strong><br />
                <small>${device.connected ? 'Conectado' : 'Sem conexão'}</small>
              </div>
              <span class="dot" style="opacity:${device.connected ? 1 : 0.35}"></span>
            </div>
          `).join('');
        } catch (error) {
          deviceList.innerHTML = '<div class="device"><div><strong>PC não encontrado</strong><br /><small>Verifique a mesma rede Wi‑Fi.</small></div><span class="dot" style="opacity:0.35"></span></div>';
        }
      }

      async function loadReceivedFiles() {
        try {
          const response = await fetch(`${baseUrl}/api/files`);
          const payload = await response.json();
          const files = payload.files || [];
          if (files.length === 0) {
            receivedFiles.textContent = 'Nenhum arquivo recebido ainda.';
            return;
          }

          receivedFiles.innerHTML = files.map((file) => `
            <div>
              <a href="${baseUrl}/api/download/${encodeURIComponent(file.name)}" target="_blank" style="color:#e5e7eb">${file.name}</a>
              <span style="color:#9ca3af"> (${formatBytes(file.size)})</span>
            </div>
          `).join('');
        } catch (error) {
          receivedFiles.textContent = 'Não foi possível listar os arquivos recebidos.';
        }
      }

      fileInput.addEventListener('change', async (event) => {
        state.selectedFiles = Array.from(event.target.files || []);
        selectedFiles.textContent = state.selectedFiles.length
          ? state.selectedFiles.map((f) => f.name).join(', ')
          : 'Nenhum arquivo selecionado';

        if (state.selectedFiles.length) {
          const total = state.selectedFiles.reduce((sum, file) => sum + file.size, 0);
          transferStatus.textContent = `${state.selectedFiles.length} arquivo(s) • ${formatBytes(total)}`;
          await uploadFiles(state.selectedFiles);
        }
      });

      async function uploadFiles(files) {
        const formData = new FormData();
        files.forEach((file) => formData.append('file', file, file.name));
        transferStatus.textContent = 'Enviando...';
        transferBar.style.width = '0%';

        try {
          const response = await fetch(`${baseUrl}/api/upload`, {
            method: 'POST',
            body: formData,
          });

          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.message || 'Falha ao enviar arquivo');
          }

          let progress = 0;
          const interval = setInterval(() => {
            progress += 12;
            transferBar.style.width = `${Math.min(progress, 100)}%`;
            if (progress >= 100) {
              clearInterval(interval);
              transferStatus.textContent = 'Transferência concluída';
            }
          }, 120);

          setTimeout(() => {
            loadReceivedFiles();
          }, 400);
        } catch (error) {
          transferStatus.textContent = `Erro: ${error.message}`;
        }
      }

      function formatBytes(bytes) {
        const units = ['B', 'KB', 'MB', 'GB'];
        let value = bytes;
        let unitIndex = 0;
        while (value >= 1024 && unitIndex < units.length - 1) {
          value /= 1024;
          unitIndex += 1;
        }
        return `${value.toFixed(1)} ${units[unitIndex]}`;
      }

      loadDevices();
      loadReceivedFiles();
    </script>
  </body>
</html>
