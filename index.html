<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DropLink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="card">
        <h1>DropLink</h1>
        <div class="device-list" id="deviceList"></div>
      </div>

      <div class="card">
        <label class="button" for="fileInput">📤 Enviar para PC</label>
        <input id="fileInput" type="file" multiple />
        <div class="file-meta" id="selectedFiles">Nenhum arquivo selecionado</div>
      </div>

      <div class="card">
        <h3>Arquivos recebidos</h3>
        <div id="receivedFiles" class="file-meta">Nenhum arquivo recebido ainda.</div>
      </div>

      <div class="card">
        <h3>Transferência</h3>
        <div class="file-meta" id="transferStatus">Aguardando arquivo...</div>
        <div class="progress" aria-label="progresso"><span id="transferBar"></span></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
